<!DOCTYPE html>
<html>
<head>
    <title>Status Update Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .test-section { margin: 20px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #007bff; }
        .test-button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 14px; }
        .test-button:hover { background: #0056b3; }
        .console { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 4px; font-family: monospace; font-size: 12px; height: 200px; overflow-y: auto; margin: 10px 0; }
        .console-error { color: #ff4444; }
        .console-info { color: #00ff00; }
        .console-warning { color: #ffaa00; }
        .dropdown { padding: 8px; font-size: 14px; min-width: 200px; }
        label { font-weight: bold; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Job Order Status Update Test</h1>
        
        <div class="test-section">
            <h3>Test 1: Dropdown & Dialog</h3>
            <p>Select a status from the dropdown to test the confirmation dialog:</p>
            <label>Job Status:</label>
            <select class="dropdown" onchange="handleStatusChange(12, this)">
                <option value="">-- Change Status --</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Mark Completed</option>
                <option value="Cancelled">Cancel Job</option>
            </select>
        </div>

        <div class="test-section">
            <h3>Test 2: Direct Update (Simulated)</h3>
            <button class="test-button" onclick="testDirectUpdate()">Test Direct API Call</button>
            <p><small>This simulates what happens when you click OK on the dialog</small></p>
        </div>

        <div class="test-section">
            <h3>Console Output</h3>
            <div class="console" id="console"></div>
            <button class="test-button" onclick="document.getElementById('console').innerHTML = ''">Clear Console</button>
        </div>

        <div class="test-section">
            <h3>Debug Info</h3>
            <button class="test-button" onclick="checkEnvironment()">Check Environment</button>
            <button class="test-button" onclick="testFetch()">Test Fetch API</button>
        </div>
    </div>

    <script>
    // Console logging override
    const consoleElement = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    console.log = function(...args) {
        originalLog(...args);
        const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
        addConsoleLog(msg, 'info');
    };

    console.error = function(...args) {
        originalError(...args);
        const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
        addConsoleLog(msg, 'error');
    };

    console.warn = function(...args) {
        originalWarn(...args);
        const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
        addConsoleLog(msg, 'warning');
    };

    function addConsoleLog(msg, type = 'info') {
        const line = document.createElement('div');
        line.className = `console-${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        consoleElement.appendChild(line);
        consoleElement.scrollTop = consoleElement.scrollHeight;
    }

    // Test functions
    function handleStatusChange(jobId, selectElement) {
        const status = selectElement.value;
        console.log('handleStatusChange called:', { jobId, status });
        
        selectElement.selectedIndex = 0;
        
        if (!status) {
            console.log('No status selected, returning');
            return;
        }
        
        let confirmMessage = `Change job status to "${status}"?`;
        
        if (status === 'Completed') {
            confirmMessage = '⚠️ Mark job as COMPLETED?\n\nThis will:\n• Move to History\n• Lock all edits\n• Finalize the order';
        } else if (status === 'Cancelled') {
            confirmMessage = '⚠️ Cancel this job?\n\nThis cannot be easily undone.';
        }
        
        console.log('Showing confirm dialog:', confirmMessage);
        if (confirm(confirmMessage)) {
            console.log('User confirmed, calling submitStatusUpdate');
            submitStatusUpdate(jobId, status, '');
        } else {
            console.log('User cancelled');
        }
    }

    async function submitStatusUpdate(jobId, status, notes) {
        const formData = new FormData();
        formData.append('action', 'update_job_status');
        formData.append('job_id', jobId);
        formData.append('status', status);
        formData.append('notes', notes);

        console.log('Submitting status update:', { jobId, status, notes });

        try {
            const response = await fetch('joborder.php', {
                method: 'POST',
                body: formData
            });

            console.log('Response status:', response.status);
            const text = await response.text();
            console.log('Response text:', text);
            
            const result = JSON.parse(text);
            console.log('Parsed result:', result);

            if (result.success) {
                console.log('✓ SUCCESS: Job status updated!');
                alert('Success! Job status updated. Page will reload in 1.5 seconds.');
                setTimeout(() => location.reload(), 1500);
            } else {
                console.error('✗ FAILED:', result.message);
                alert('Error: ' + (result.message || 'Failed to update status'));
            }
        } catch (error) {
            console.error('Exception occurred:', error.message, error.stack);
            alert('Error updating job status: ' + error.message);
        }
    }

    function testDirectUpdate() {
        console.log('Testing direct API call to joborder.php...');
        submitStatusUpdate(12, 'Completed', '');
    }

    function checkEnvironment() {
        console.log('=== ENVIRONMENT CHECK ===');
        console.log('Current URL:', window.location.href);
        console.log('Page origin:', window.location.origin);
        console.log('Fetch available:', typeof fetch !== 'undefined');
        console.log('confirm() available:', typeof confirm !== 'undefined');
        console.log('JSON.parse available:', typeof JSON.parse !== 'undefined');
        
        // Check if handleStatusChange is defined
        console.log('handleStatusChange defined:', typeof handleStatusChange !== 'undefined');
        console.log('submitStatusUpdate defined:', typeof submitStatusUpdate !== 'undefined');
    }

    function testFetch() {
        console.log('Testing fetch API...');
        fetch('joborder.php', {
            method: 'POST',
            body: new FormData(Object.entries({action: 'test'}).reduce((fd, [k, v]) => {
                const formData = new FormData();
                formData.append(k, v);
                return formData;
            }, new FormData()))
        })
        .then(r => r.text())
        .then(text => {
            console.log('Fetch test response:', text.substring(0, 200));
        })
        .catch(e => {
            console.error('Fetch test failed:', e.message);
        });
    }

    // Auto-run environment check on load
    window.addEventListener('load', function() {
        console.log('Page loaded, environment ready');
        checkEnvironment();
    });
    </script>
</body>
</html>
